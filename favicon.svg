<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1626"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0088ff"/>
    </linearGradient>
    <linearGradient id="screen-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111c30"/>
      <stop offset="100%" stop-color="#090e1a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg-grad)" stroke="#00c3ff" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Ambient Glow Behind Screen -->
  <circle cx="32" cy="28" r="15" fill="#00c3ff" opacity="0.18" />

  <!-- TV Monitor Outer Frame -->
  <rect x="11" y="12" width="42" height="30" rx="4.5" fill="url(#screen-glass)" stroke="url(#cyan-glow)" stroke-width="2" filter="url(#glow)" />

  <!-- Screen Glass Highlight / Reflection -->
  <path d="M 13 14 L 38 14 L 28 26 L 13 26 Z" fill="#ffffff" opacity="0.07" />

  <!-- Play Symbol (Glowing Cyan) -->
  <polygon points="28,21 40,27 28,33" fill="url(#cyan-glow)" filter="url(#glow)" />

  <!-- TV Stand Base -->
  <path d="M 26 42 L 38 42 M 32 42 L 32 46 M 22 49 C 27 47, 37 47, 42 49" stroke="url(#cyan-glow)" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#glow)" />
</svg>
